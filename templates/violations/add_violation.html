{% extends "staff_base.html" %}
{% load crispy_forms_tags %}
{% block title %}Record Violation{% endblock %}
{% block page_title %}Record Violation — {{ franchise.franchise_number }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Save Violation</button>
        </form>
    </div>
</div>
{% endblock %}
